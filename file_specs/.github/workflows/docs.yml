name: Generate Markdown Docs

permissions:
  contents: write

on:
  push:
    branches: ["**"]
    paths:
      - "scripts/**"
      - "specifications/**"
      - "changelogs/**"

jobs:
  docs-generation:
    name: Markdown generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run markdown generation script
        run: python "scripts/generate_markdown.py"

      - name: Run script for creating the JSON changelogs
        run: python "scripts/generate_json_changelog.py" 2027.01 "origin/${{ github.ref_name }}" --cicd

      - name: Run script for creating the Markdown changelogs
        run: python "scripts/generate_markdown_changelog.py"

      - name: Commit and push if changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "Auto-generate Markdown docs"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
