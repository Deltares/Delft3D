[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deltares-testbench"
version = "4.0.0"
description = """\
    The Testbench is aimed at supporting quality assurance of the Deltares \
    software products, by giving an accessible means of structured, repeatable \
    testing. Specifically, the Testbench software is designed to test the \
    output of the software products, rather than testing the software \
    functionality.\
"""
authors = [
    {name = "Team Black Ops", email = "black-ops@deltares.nl"},  # Main point of contact.
    {name = "Hidde Elzinga"},
    {name = "Adri Mourits"},
    {name = "Jan Mooiman"},
    # Among others.
]

requires-python = ">=3.12"
dependencies = [
    "netCDF4 ~= 1.7.5",
    "lxml ~= 6.1.3",
    "matplotlib ~= 3.11.2",
    "numpy ~= 2.5.4",
    "dvc ~= 3.67.1",
    "dvc-s3 ~= 3.3.0",
]

[project.optional-dependencies]
dev = [
    "mypy ~= 2.4",
    "pyfakefs ~= 6.3",
    "pytest ~= 9.2",
    "pytest-cov ~= 7.1",
    "pytest-mock ~= 3.17",
    "ruff ~= 0.17",
]

# Optional console command, available after an editable install (`pip install -e .`) from this directory.
# `python TestBench.py ...` keeps working and is what CI uses.
[project.scripts]
testbench = "TestBench:main"

# Needed for the editable install: ship `TestBench.py` and the `src` package (imported as `src.*`).
[tool.setuptools]
py-modules = ["TestBench"]

[tool.setuptools.packages.find]
include = ["src*"]
namespaces = true  # `src/` has no `__init__.py` files.

# Ruff settings (linting and formatting).
# https://docs.astral.sh/ruff/settings/
[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
exclude = [
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "build",
    "dist",
    "thirdparty",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
# Error codes: https://docs.astral.sh/ruff/rules/#legend
# List of error codes, or prefixes of error codes. For instance `E1` matches codes E100-E199.
select = [
    "I",  # import ordering
    "E",  # pycodestyle errors
    "W",  # Warnings
    "F",  # pyflakes errors
    "D",  # pydocstyle errors
    "B",  # flake8-bugbear common bugs
    "A",  # flake8-builtins warns against shadowing builtins
    "N",  # pep8-naming conventions
    "ANN", # flake8-annotations
    "DTZ", # flake8-datetimez, for datetime and timezone bugs.
    "PT", # flake8-pytest-style
]
ignore = [
    "ANN1",  # These type annotation violations are deprecated.
    "D100",  # Ignore missing docstrings for modules.
]

[tool.ruff.lint.per-file-ignores]
"test/**/*.py" = [
    "D1",  # Don't care about docstrings in unit tests.
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"  # https://numpydoc.readthedocs.io/en/latest/format.html

# Mypy settings (type checking)
# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
warn_unused_configs = true
warn_return_any = true
pretty = true
show_error_context = true

# Gets rid of complaints that type stubs are not installed for selected modules.
[[tool.mypy.overrides]]
ignore_missing_imports = true

# Coverage settings (pytest-cov / coverage.py)
# https://coverage.readthedocs.io/en/latest/config.html
[tool.coverage.run]
# This prevents a strange error when running `pytest` with coverage. For some reason this doesn't
# work well in combination with the `netCDF4` package which includes `Cython` code: A file with
# `.pyx` extension that `coverage.py` tries to parse as python code and gives the following
# warning: https://coverage.readthedocs.io/en/7.15.2/messages.html#warning-couldnt-parse
omit = [
    "src/netCDF4/*",
]

# Pytest settings
# https://docs.pytest.org/en/stable/reference/customize.html
[tool.pytest.ini_options]
addopts = """\
    --doctest-modules \
    --verbose \
    --junitxml=logs/pytest_results.xml \
    -W error \
    --ignore=src \
    --ignore=thirdparty \
"""
testpaths = ["test"]
junit_family = "xunit2"
junit_log_passing_tests = true
junit_logging = "log"
log_cli = true
log_level = "INFO"
log_cli_format = "%(levelname)s - %(asctime)s - %(message)s"
log_cli_date_format = "%Y-%m-%dT%H:%M:%S%z"
