name: Cancel testbench

on:
  push:
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Target commit(s)"
        required: true
        default: "latest"
        type: choice
        options:
          - all
          - latest
          - specific
      commit_hash:
        description: "Commit hash"
        required: false
        default: ""
        type: string

jobs:
  cancel-testbench:
    runs-on: ubuntu-latest

    env:
      BRANCH: ${{ github.ref_name }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN  }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure
        id: configure
        run: |
          # do not allow running this workflow on the default and release branches
          default_branch="${{ github.event.repository.default_branch }}"
          release_branch_regex='^all/release/\d{4}\.\d+$'
          if [[ "${{ env.BRANCH }}" == "${default_branch}" || \
                "${{ env.BRANCH }}" =~ ${release_branch_regex} ]]; then
            echo "This workflow was dispatched on branch {{ env.BRANCH }}."
            echo "Dispatching this workflow on ${default_branch} and release branches is forbidden."
            exit 1
          fi

          commit_hash=""
          if [[ "${{ github.event.inputs.target_commit }}" == "latest" ]]; then
            commit_hash=$(
              curl \
                --silent \
                --fail \
                --show-error \
                --request GET \
                --header "Authorization: Bearer ${{ env.GITHUB_TOKEN }}" \
                --header "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ env.OWNER }}/${{ env.REPO }}/branches/${{ env.BRANCH }}" \
              | jq -r .commit.sha
            )
          elif [[ "${{ github.event.inputs.target_commit }}" == "specific" ]]; then
            commit_hash="${{ github.event.inputs.commit_hash }}"
            if [[ -z "${commit_hash}" ]]; then
              echo "An attempt to cancel the build of a specific commit was made but no hash was provided."
              exit 1
            fi

            if ! git merge-base --is-ancestor "${commit_hash}" "${{ env.BRANCH }}"; then
              echo "Commit ${commit_hash} does not exist on branch ${{ env.BRANCH }}."
              exit 1
            fi

          fi
          echo "commit_hash=${commit_hash}" >> $GITHUB_OUTPUT

      - name: Find PR for current branch
        id: find-pr
        run: |
          set -eou pipefail

          pr_list=$(
            curl \
              --silent \
              --fail \
              --show-error \
              --request GET \
              --header "Authorization: Bearer ${{ env.GITHUB_TOKEN }}" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ env.OWNER }}/${{ env.REPO }}/pulls?state=open&head=${{ env.OWNER}}:${{ env.BRANCH}}"
          )

          pr_count=$(echo "${pr_list}" | jq 'length')

          if [ "${pr_count}" -eq 0 ]; then
            echo "No open pull request found for branch ${{ env.BRANCH }}."
            exit 0
          fi

          if [ "${pr_count}" -gt 1 ]; then
            echo "Multiple pil;l requests found for branch ${{ env.BRANCH }}. Cannot proceed further."
            exit 1
          fi

          pr_number=$(echo "$pr_list" | jq -r '.[0].number')

          echo "Found pull request #${pr_number}."
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Retrieve KSM credentials
        id: retrieve-ksm-credentials
        env:
          KSM_APP_CONFIG: ${{ secrets.KSM_APP_CONFIG }}
          KSM_RECORD_UID: ${{ secrets.KSM_RECORD_UID }}
        uses: Keeper-Security/ksm-action@v1.1.0
        with:
          keeper-secret-config: ${{ env.KSM_APP_CONFIG }}
          secrets: |-
            keeper://${{ env.KSM_RECORD_UID }}/field/password > teamcity_token

      - name: Cancel testbench
        if: steps.retrieve-ksm-credentials.outcome == 'success'
        run: |
          set -eou pipefail

          teamcity_builds="https://dpcbuild.deltares.nl/app/rest/builds"
          teamcity_project_id="Delft3D"
          branch="pull/${{ steps.find-pr.outputs.pr_number }}"
          commit_hash="${{ steps.configure.outputs.commit_hash }}"
          platforms=("Linux" "Windows")
          payload='{ "buildCancelRequest": { "comment": "Build cancelled from GitHub", "readdIntoQueue": false } }'

          for platform in "${platforms[@]}"; do
            build_type="${teamcity_project_id}_${platform}Test"

            request_url=$(
              printf \
                '%s?locator=affectedProject:%s,buildType:%s,branch:%s,state:any,count:100' \
                "${teamcity_builds}" \
                "${teamcity_project_id}" \
                "${build_type}" \
                "${branch}"
            )


            if [[ -z "${commit_hash}" ]]; then
              request_url=$(printf '${request_url},revision:%s "${commit_hash}")
            fi

            builds=$(
              curl \
               --silent \
                --fail \
                --show-error \
                --request GET \
                --header "Authorization: Bearer ${{ steps.retrieve-ksm-credentials.outputs.teamcity_token }}" \
                --header "Accept: application/json" \
                "${request_url}"
            )

            # loop over all builds
            echo "${builds}" | jq -c '.build[]' | while read -r build; do
              state=$(echo "${build}" | jq -r '.state')

              if [[ "${state}" == "pending" ||
                    "${state}" == "queued" ||
                    "${state}" == "running" ]]; then # this is equivalent to != "finished"
                id=$(echo "${build}" | jq -r '.id')
                request_url="${teamcity_builds}/id:${id}"

                echo "Cancelling ${build_type} (id=${id})..."

                response_code=$(
                  curl \
                    --silent \
                    --show-error \
                    --write-out "%{response_code}" \
                    --output /dev/null \
                    --request POST \
                    --header "Authorization: Bearer ${{ steps.retrieve-ksm-credentials.outputs.teamcity_token }}" \
                    --header "Accept: application/json" \
                    --header "Content-Type: application/json" \
                    --data "${payload}" \
                    "${request_url}"
                )

                if [ "${response_code}" -ge 400 ]; then
                  echo "Cancellation failed for build id=${id}. Status ${response_code}."
                  exit 1
                fi
              fi
            done
          done
