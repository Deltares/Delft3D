name: pip-audit

# Dependency-vulnerability scan. CVEs are disclosed over time against packages we already
# ship, so besides every PR touching the Python dependencies the weekly schedule re-audits the
# unchanged tree and catches a freshly disclosed vulnerability without needing a code change.

permissions:
  contents: read

env:
  # Version of pip-audit used by all jobs. Pinned so a new release cannot change the results unnoticed.
  PIP_AUDIT_VERSION: "2.10.1"

on:
  pull_request:
    paths:
      - "ci/python/pyproject.toml"
      - "ci/python/uv.lock"
      - "test/deltares_testbench/pyproject.toml"
      - "test/deltares_testbench/uv.lock"
      - "tools/deltares_fortran_styler/pyproject.toml"
      - "tools/deltares_fortran_styler/uv.lock"
      - ".github/workflows/pip-audit.yml"
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-tools:
    # ci/python is locked with uv. The lockfile is exported to pinned requirements, which pip-audit
    # checks against the PyPI/OSV advisory DB without installing anything.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Export locked requirements
        working-directory: ci/python
        run: uv export --frozen --all-extras --no-emit-project --no-hashes -o "${RUNNER_TEMP}/ci-tools-reqs.txt"

      - name: Audit dependencies with pip-audit
        run: uvx pip-audit==${PIP_AUDIT_VERSION} --requirement "${RUNNER_TEMP}/ci-tools-reqs.txt" --no-deps --disable-pip --desc

  testbench:
    # test/deltares_testbench is locked with uv. One uv.lock covers Windows and Linux, and the exported
    # requirements keep the environment markers (for example pywin32 is Windows-only). pip-audit evaluates
    # the markers on the machine it runs on, so audit on both operating systems.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # pip-audit prints non-ASCII characters; the Windows default code page cannot encode them.
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Export locked requirements
        working-directory: test/deltares_testbench
        run: uv export --frozen --all-extras --no-emit-project --no-hashes -o audit-requirements.txt

      - name: Audit dependencies with pip-audit
        run: uvx pip-audit==${PIP_AUDIT_VERSION} --requirement test/deltares_testbench/audit-requirements.txt --no-deps --disable-pip --desc

  fortran-styler:
    # tools/deltares_fortran_styler is locked with uv (no runtime dependencies, only the dev tools).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Export locked requirements
        working-directory: tools/deltares_fortran_styler
        run: uv export --frozen --all-extras --no-emit-project --no-hashes -o "${RUNNER_TEMP}/styler-reqs.txt"

      - name: Audit dependencies with pip-audit
        run: uvx pip-audit==${PIP_AUDIT_VERSION} --requirement "${RUNNER_TEMP}/styler-reqs.txt" --no-deps --disable-pip --desc
