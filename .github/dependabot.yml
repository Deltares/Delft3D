version: 2
updates:
  # ci/python is locked with uv
  - package-ecosystem: "uv"
    directory: "/ci/python"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns: ["*"]

  # test/deltares_testbench is locked with uv (uv.lock replaced the pip/*-requirements.txt files)
  - package-ecosystem: "uv"
    directory: "/test/deltares_testbench"
    schedule:
      interval: "weekly"
    groups:
      testbench-deps:
        patterns: ["*"]

  # tools/deltares_fortran_styler is locked with uv
  - package-ecosystem: "uv"
    directory: "/tools/deltares_fortran_styler"
    schedule:
      interval: "weekly"
    groups:
      styler-deps:
        patterns: ["*"]

  # GitHub Actions used in .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
